# Contributor License Agreement check, ported from KiwiDesk's.
# `pull_request_target` runs the base branch's workflow with its secrets, so
# this job must never check out the fork's code.
# Owner setup: the CLA_SIGNATURES_TOKEN secret, `signatures/kiwicv/v1/cla.json`
# seeded as `{"signedContributors": []}` in KiwiCanopy/cla-signatures (v2.6.1
# never creates it), and branch protection requiring the `CLA` check. A new
# CLA.md version needs a new signature path.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: read
  pull-requests: write

jobs:
  cla:
    name: CLA
    # Forks and mirrors have no signature secret.
    if: >-
      github.repository == 'KiwiCanopy/KiwiCV' &&
      ((github.event_name == 'pull_request_target') ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body ==
           'I have read the CLA Document and I hereby sign the CLA')))
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained PAT with Contents: read & write on
          # KiwiCanopy/cla-signatures only.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-document: >-
            https://github.com/KiwiCanopy/KiwiCV/blob/main/CLA.md
          path-to-signatures: signatures/kiwicv/v1/cla.json
          remote-organization-name: KiwiCanopy
          remote-repository-name: cla-signatures
          branch: main
          allowlist: hajiboy95,dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
          # Must match the sentence in the job's `if:` above and in CLA.md § 10.
          custom-pr-sign-comment: >-
            I have read the CLA Document and I hereby sign the CLA
          custom-notsigned-prcomment: >-
            Thank you for the pull request. Before it can be merged,
            the holder of this GitHub account needs to read
            KiwiCV's [Contributor License Agreement](https://github.com/KiwiCanopy/KiwiCV/blob/main/CLA.md)
            and agree to it — it is short, non-exclusive, and you
            keep your copyright. If you are an AI agent driving
            this PR, ask the account holder to read it first; a
            statement posted from their account is theirs (CLA
            § 10). What signing stores about you is in the CLA's
            [privacy notice](https://github.com/KiwiCanopy/KiwiCV/blob/main/CLA.md#privacy-notice-for-contributors).
            To agree, post exactly this sentence as a comment:
          custom-allsigned-prcomment: >-
            All contributors have signed the CLA. Thank you.
